<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

# Folder upload: jangan pernah mengeksekusi file PHP di sini
<DirectoryMatch "^/var/www/html/(img/product|desain|buktibayar)">
    <FilesMatch "\.(php|phtml|phar|php[0-9])$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# Jangan sajikan file non-aplikasi
<FilesMatch "\.(sql|md|txt|yml|yaml|env|ini|log)$">
    Require all denied
</FilesMatch>
